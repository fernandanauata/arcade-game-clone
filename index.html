<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Effective JavaScript: Bug Game</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css?family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <link href="https://fonts.googleapis.com/css?family=Roboto&display=swap" rel="stylesheet" />
  </head>
  <body>
    <header>
      <h1>Effective JavaScript: Bug Game</h1>
      <div class="instructions">
        <p class="text-instructions">
          Bug game is a web game and a recreation of the classic arcade game Frogger! It was made
          using CSS3, HTML5 and JavaScript.
        </p>
      </div>
    </header>

    <main>
      <div class="hud">
        <span id="score">Score: 0</span>
        <span id="lives">Lives: 3</span>
        <button id="restart-btn" type="button">Restart</button>
      </div>

      <!-- Engine appends the game canvas into this element. It's a
           focusable landmark for keyboard/screen-reader users even
           though input handling isn't scoped to its focus state. -->
      <div
        id="game-container"
        class="game-container"
        tabindex="0"
        aria-label="Bug Game board. Use the arrow keys to move the character."
      ></div>

      <p id="game-status" class="game-status" role="status" aria-live="polite"></p>
    </main>

    <!-- How to play -->
    <p class="text-instructions">
      To move the character you'll use the <strong>arrow keys</strong> • Do not touch the bugs or
      you'll lose a life • Get to the water to score!
    </p>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
